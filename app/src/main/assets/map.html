<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gym Map - Byce</title>
    <link rel="stylesheet" href="maplibre-gl.css" />
    <script src="maplibre-gl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .marker {
            background-color: #A6CE39;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .marker.selected {
            background-color: #8AB82E;
            width: 40px;
            height: 40px;
            border-color: #A6CE39;
            box-shadow: 0 0 20px rgba(166, 206, 57, 0.8);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        let map = null;
        let markers = [];
        let currentGyms = [];
        
        // Initialize map centered on Ernakulam (Kochi)
        try {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://tiles.openfreemap.org/styles/liberty',
                center: [76.2814, 9.9674], // Kochi MG Road
                zoom: 11,
                pitch: 0,
                bearing: 0
            });
            
            map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
            
            map.on('load', () => {
                console.log('Map loaded successfully');
                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            });
            
            map.on('error', (e) => {
                console.error('Map error:', e.error);
            });
            
        } catch(err) {
            console.error('Map initialization error:', err);
        }
        
        // Function to clear all markers
        function clearMarkers() {
            markers.forEach(marker => marker.remove());
            markers = [];
        }
        
        // Function to add gym markers
        window.updateGyms = function(gymsJson) {
            try {
                const gyms = typeof gymsJson === 'string' ? JSON.parse(gymsJson) : gymsJson;
                currentGyms = gyms;
                
                clearMarkers();
                
                if (!map || gyms.length === 0) return;
                
                gyms.forEach(gym => {
                    // Create marker element
                    const el = document.createElement('div');
                    el.className = 'marker';
                    el.innerHTML = '📍';
                    
                    el.addEventListener('click', () => {
                        if (window.AndroidBridge && window.AndroidBridge.onGymClick) {
                            window.AndroidBridge.onGymClick(gym.id);
                        }
                    });
                    
                    // Add marker to map
                    const marker = new maplibregl.Marker({
                        element: el,
                        anchor: 'bottom'
                    })
                    .setLngLat([gym.longitude, gym.latitude])
                    .addTo(map);
                    
                    markers.push({
                        marker: marker,
                        element: el,
                        gymId: gym.id
                    });
                });
                
                // Fit map to show all gyms
                if (gyms.length > 0) {
                    const bounds = new maplibregl.LngLatBounds();
                    gyms.forEach(gym => {
                        bounds.extend([gym.longitude, gym.latitude]);
                    });
                    map.fitBounds(bounds, {
                        padding: 50,
                        maxZoom: 14
                    });
                }
                
                console.log('Added ' + gyms.length + ' gym markers');
            } catch(err) {
                console.error('updateGyms error:', err);
            }
        };
        
        // Function to highlight selected gym
        window.selectGym = function(gymId) {
            try {
                markers.forEach(m => {
                    if (m.gymId === gymId) {
                        m.element.classList.add('selected');
                        const gym = currentGyms.find(g => g.id === gymId);
                        if (gym && map) {
                            map.flyTo({
                                center: [gym.longitude, gym.latitude],
                                zoom: 15,
                                duration: 1000
                            });
                        }
                    } else {
                        m.element.classList.remove('selected');
                    }
                });
            } catch(err) {
                console.error('selectGym error:', err);
            }
        };
        
        // Function to recenter map
        window.recenterMap = function() {
            try {
                if (map && currentGyms.length > 0) {
                    const bounds = new maplibregl.LngLatBounds();
                    currentGyms.forEach(gym => {
                        bounds.extend([gym.longitude, gym.latitude]);
                    });
                    map.fitBounds(bounds, {
                        padding: 50,
                        maxZoom: 14,
                        duration: 1000
                    });
                }
            } catch(err) {
                console.error('recenterMap error:', err);
            }
        };
    </script>
</body>
</html>
