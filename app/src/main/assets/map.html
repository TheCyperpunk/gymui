<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gym Map - Byce</title>
    <link rel="stylesheet" href="maplibre-gl.css" />
    <script src="maplibre-gl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
        }
        .maplibregl-ctrl-bottom-right {
            display: none;
        }
        .gym-marker {
            background-color: #A6CE39;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 3px 12px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        .gym-marker.selected {
            background-color: #8AB82E;
            width: 42px;
            height: 42px;
            border-color: #A6CE39;
            border-width: 4px;
            box-shadow: 0 0 30px rgba(166, 206, 57, 0.95);
            z-index: 1000;
        }
        .maplibregl-popup-content {
            background-color: #1a1a1a;
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        .gym-popup h3 {
            color: #A6CE39;
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 600;
        }
        .gym-popup p {
            margin: 3px 0;
            font-size: 12px;
            color: #bbb;
        }
        .maplibregl-popup-tip {
            border-top-color: #1a1a1a !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        let map = null;
        let markers = {};
        let popups = {};
        let currentGyms = [];
        let selectedGymId = null;
        let isMapReady = false;
        
        console.log('Initializing map...');
        
        // Initialize MapLibre map with OpenFreeMap dark style
        try {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://tiles.openfreemap.org/styles/dark',
                center: [76.2944, 10.8505], // Kerala center
                zoom: 7.5,
                pitch: 0,
                bearing: 0,
                attributionControl: false
            });
            
            console.log('Map object created');
            
            map.on('load', function() {
                console.log('Map loaded successfully!');
                isMapReady = true;
                
                // Notify Android that map is ready
                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            });
            
            map.on('error', function(e) {
                console.error('Map error:', e);
            });
            
        } catch(err) {
            console.error('Map initialization failed:', err);
        }
        
        // Clear all markers
        function clearMarkers() {
            Object.values(markers).forEach(function(marker) {
                marker.remove();
            });
            Object.values(popups).forEach(function(popup) {
                popup.remove();
            });
            markers = {};
            popups = {};
        }
        
        // Add gym markers to map
        window.updateGyms = function(gymsJson) {
            try {
                console.log('updateGyms called');
                
                var gyms = typeof gymsJson === 'string' ? JSON.parse(gymsJson) : gymsJson;
                currentGyms = gyms;
                
                if (!isMapReady) {
                    console.log('Map not ready, waiting...');
                    setTimeout(function() {
                        window.updateGyms(gymsJson);
                    }, 500);
                    return;
                }
                
                clearMarkers();
                
                if (!map || gyms.length === 0) {
                    console.log('No gyms or map not initialized');
                    return;
                }
                
                var bounds = new maplibregl.LngLatBounds();
                
                gyms.forEach(function(gym) {
                    // Create marker element
                    var el = document.createElement('div');
                    el.className = 'gym-marker';
                    el.innerHTML = '📍';
                    el.setAttribute('data-gym-id', gym.id);
                    
                    // Popup content
                    var popupContent = 
                        '<div class="gym-popup">' +
                        '<h3>' + gym.name + '</h3>' +
                        '<p>📍 ' + gym.cityArea + '</p>' +
                        '<p>⭐ ' + gym.rating + ' • ' + gym.distance + '</p>' +
                        '<p>' + gym.statusText + '</p>' +
                        '</div>';
                    
                    var popup = new maplibregl.Popup({
                        offset: 25,
                        closeButton: false,
                        closeOnClick: false
                    }).setHTML(popupContent);
                    
                    // Click handler
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (window.AndroidBridge && window.AndroidBridge.onGymClick) {
                            window.AndroidBridge.onGymClick(gym.id);
                        }
                    });
                    
                    // Create marker
                    var marker = new maplibregl.Marker({
                        element: el,
                        anchor: 'bottom'
                    })
                    .setLngLat([gym.longitude, gym.latitude])
                    .setPopup(popup)
                    .addTo(map);
                    
                    markers[gym.id] = marker;
                    popups[gym.id] = popup;
                    
                    bounds.extend([gym.longitude, gym.latitude]);
                });
                
                // Fit map to show all gyms
                if (gyms.length > 0) {
                    map.fitBounds(bounds, {
                        padding: { top: 80, bottom: 80, left: 50, right: 50 },
                        maxZoom: 11,
                        duration: 1000
                    });
                }
                
                console.log('Added ' + gyms.length + ' gym markers');
            } catch(err) {
                console.error('updateGyms error:', err);
            }
        };
        
        // Highlight selected gym
        window.selectGym = function(gymId) {
            try {
                console.log('selectGym:', gymId);
                
                // Remove selected class from all markers
                var allMarkers = document.querySelectorAll('.gym-marker');
                allMarkers.forEach(function(el) {
                    el.classList.remove('selected');
                });
                
                // Close all popups
                Object.values(popups).forEach(function(popup) {
                    popup.remove();
                });
                
                // Add selected class to target marker
                var targetEl = document.querySelector('[data-gym-id="' + gymId + '"]');
                if (targetEl) {
                    targetEl.classList.add('selected');
                }
                
                // Find gym and fly to it
                var gym = currentGyms.find(function(g) { return g.id === gymId; });
                if (gym && map && isMapReady) {
                    map.flyTo({
                        center: [gym.longitude, gym.latitude],
                        zoom: 14,
                        duration: 1200,
                        essential: true
                    });
                    
                    // Show popup
                    setTimeout(function() {
                        if (markers[gymId] && popups[gymId]) {
                            popups[gymId].addTo(map);
                        }
                    }, 1300);
                }
                
                selectedGymId = gymId;
            } catch(err) {
                console.error('selectGym error:', err);
            }
        };
        
        // Recenter map to show all gyms
        window.recenterMap = function() {
            try {
                console.log('recenterMap called');
                
                if (!map || !isMapReady || currentGyms.length === 0) {
                    return;
                }
                
                // Remove selection
                var allMarkers = document.querySelectorAll('.gym-marker');
                allMarkers.forEach(function(el) {
                    el.classList.remove('selected');
                });
                
                // Close all popups
                Object.values(popups).forEach(function(popup) {
                    popup.remove();
                });
                
                // Fit bounds
                var bounds = new maplibregl.LngLatBounds();
                currentGyms.forEach(function(gym) {
                    bounds.extend([gym.longitude, gym.latitude]);
                });
                
                map.fitBounds(bounds, {
                    padding: { top: 80, bottom: 80, left: 50, right: 50 },
                    maxZoom: 11,
                    duration: 1200
                });
                
                selectedGymId = null;
            } catch(err) {
                console.error('recenterMap error:', err);
            }
        };
    </script>
</body>
</html>
