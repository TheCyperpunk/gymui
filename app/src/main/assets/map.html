<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenFreeMap Dark Theme - MapLibre GL JS</title>
    <link href="maplibre-gl.css" rel="stylesheet" />
    <script src="maplibre-gl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .maplibregl-ctrl-bottom-right, 
        .maplibregl-ctrl-bottom-left, 
        .maplibregl-ctrl-attrib,
        .maplibregl-ctrl-logo {
            display: none !important;
        }
        
        /* User Location Marker */
        .user-marker {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-dot {
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(166, 206, 57, 0.9), 0 0 4px #000;
            z-index: 2;
        }
        .user-pulse {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(166, 206, 57, 0.45);
            animation: radarWave 2.2s infinite ease-out;
            z-index: 1;
        }
        @keyframes radarWave {
            0% { transform: scale(0.3); opacity: 0.9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Gym Marker Styles */
        .gym-marker {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
        }
        .gym-marker.selected {
            transform: scale(1.22);
            z-index: 100 !important;
        }
        .gym-badge {
            background: rgba(26, 25, 27, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            margin-bottom: 4px;
            transition: all 0.2s ease;
        }
        .gym-marker.selected .gym-badge {
            background: rgba(30, 29, 31, 0.98);
            border: 1.5px solid #A6CE39;
            box-shadow: 0 0 16px rgba(166, 206, 57, 0.6), 0 6px 18px rgba(0,0,0,0.8);
            color: #ffffff;
        }
        .gym-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #A6CE39;
            box-shadow: 0 0 6px #A6CE39;
        }
        .gym-pin {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #242325;
            border: 2px solid rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        .gym-marker.selected .gym-pin {
            background: #2D2C2F;
            border: 2.5px solid #A6CE39;
            box-shadow: 0 0 14px rgba(166, 206, 57, 0.65), 0 4px 12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

        try {
            map = new maplibregl.Map({
                container: 'map',
                style: STYLE_JSON,
                center: [-122.4090, 37.7840],
                zoom: 13.5,
                pitch: 35,
                bearing: -8,
                attributionControl: false
            });

            // User pulse marker
            const userEl = document.createElement('div');
            userEl.className = 'user-marker';
            userEl.innerHTML = '<div class="user-pulse"></div><div class="user-dot"></div>';
            new maplibregl.Marker({ element: userEl })
                .setLngLat(USER_COORDS)
                .addTo(map);

            map.on('load', () => {
                console.log('MapLibre GL map loaded successfully!');
                if (currentGyms.length > 0) {
                    renderGyms(currentGyms);
                }
                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            });

            map.on('error', (e) => {
                console.error('MapLibre GL error:', e);
            });
        } catch(err) {
            console.error('MapLibre initialization exception:', err);
        }

        function renderGyms(gyms) {
            currentGyms = gyms;
            if (!map) return;
            Object.values(markers).forEach(m => m.remove());
            markers = {};

            gyms.forEach(gym => {
                const el = document.createElement('div');
                el.className = 'gym-marker' + (gym.id === selectedGymId ? ' selected' : '');
                el.id = 'marker-' + gym.id;

                el.innerHTML = `
                    <div class="gym-badge">
                        <div class="gym-dot"></div>
                        <span>${gym.name}</span>
                    </div>
                    <div class="gym-pin">🏋️</div>
                `;

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectGym(gym.id, true);
                    if (window.AndroidBridge && window.AndroidBridge.onGymClick) {
                        window.AndroidBridge.onGymClick(gym.id);
                    }
                });

                const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                    .setLngLat([gym.longitude, gym.latitude])
                    .addTo(map);

                markers[gym.id] = marker;
            });
        }

        function selectGym(gymId, skipFly) {
            selectedGymId = gymId;
            document.querySelectorAll('.gym-marker').forEach(el => {
                el.classList.remove('selected');
            });
            const targetEl = document.getElementById('marker-' + gymId);
            if (targetEl) {
                targetEl.classList.add('selected');
            }

            const gym = currentGyms.find(g => g.id === gymId);
            if (gym && !skipFly && map) {
                map.flyTo({
                    center: [gym.longitude, gym.latitude],
                    zoom: 15,
                    pitch: 45,
                    speed: 1.2,
                    curve: 1.4,
                    essential: true
                });
            }
        }

        function recenterMap() {
            if (map) {
                map.flyTo({
                    center: USER_COORDS,
                    zoom: 13.5,
                    pitch: 35,
                    bearing: -8,
                    speed: 1.2,
                    essential: true
                });
            }
        }

        window.selectGym = selectGym;
        window.recenterMap = recenterMap;
        window.updateGyms = function(gymsJson) {
            try {
                const gyms = typeof gymsJson === 'string' ? JSON.parse(gymsJson) : gymsJson;
                renderGyms(gyms);
            } catch (err) {
                console.error('Error parsing gyms json', err);
            }
        };
    </script>
