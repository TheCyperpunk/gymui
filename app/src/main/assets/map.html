<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gym Map - Byce</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
        }
        .gym-marker {
            background-color: #A6CE39;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }
        .gym-marker.selected {
            background-color: #8AB82E;
            width: 44px;
            height: 44px;
            border-color: #A6CE39;
            box-shadow: 0 0 25px rgba(166, 206, 57, 0.9);
            z-index: 1000 !important;
        }
        .leaflet-popup-content-wrapper {
            background-color: #1a1a1a;
            color: white;
            border-radius: 12px;
        }
        .leaflet-popup-content {
            margin: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .gym-popup h3 {
            color: #A6CE39;
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        .gym-popup p {
            margin: 4px 0;
            font-size: 13px;
            color: #ccc;
        }
        .leaflet-popup-tip {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        let map = null;
        let markers = {};
        let currentGyms = [];
        let selectedGymId = null;
        
        // Initialize Leaflet map centered on Kochi
        try {
            map = L.map('map', {
                center: [9.9674, 76.2814], // Kochi MG Road
                zoom: 11,
                zoomControl: true,
                attributionControl: false
            });
            
            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                minZoom: 8
            }).addTo(map);
            
            // Map loaded event
            setTimeout(() => {
                console.log('Map initialized successfully');
                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            }, 500);
            
        } catch(err) {
            console.error('Map initialization error:', err);
            document.getElementById('map').innerHTML = 
                '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:white;text-align:center;padding:20px;background:#0c0c0c;">' +
                '<div><h2>Map Error</h2><p>' + err.message + '</p></div></div>';
        }
        
        // Function to clear all markers
        function clearMarkers() {
            Object.values(markers).forEach(marker => {
                map.removeLayer(marker);
            });
            markers = {};
        }
        
        // Function to create custom marker icon
        function createMarkerIcon(gymId) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: '<div class="gym-marker" data-gym-id="' + gymId + '">📍</div>',
                iconSize: [36, 36],
                iconAnchor: [18, 36]
            });
        }
        
        // Function to add gym markers
        window.updateGyms = function(gymsJson) {
            try {
                const gyms = typeof gymsJson === 'string' ? JSON.parse(gymsJson) : gymsJson;
                currentGyms = gyms;
                
                clearMarkers();
                
                if (!map || gyms.length === 0) {
                    console.log('No gyms to display or map not ready');
                    return;
                }
                
                const bounds = [];
                
                gyms.forEach(gym => {
                    const marker = L.marker(
                        [gym.latitude, gym.longitude],
                        { icon: createMarkerIcon(gym.id) }
                    );
                    
                    // Popup content
                    const popupContent = 
                        '<div class="gym-popup">' +
                        '<h3>' + gym.name + '</h3>' +
                        '<p>📍 ' + gym.cityArea + '</p>' +
                        '<p>⭐ ' + gym.rating + ' • ' + gym.distance + '</p>' +
                        '<p>' + gym.statusText + '</p>' +
                        '</div>';
                    
                    marker.bindPopup(popupContent);
                    
                    // Click handler
                    marker.on('click', function() {
                        if (window.AndroidBridge && window.AndroidBridge.onGymClick) {
                            window.AndroidBridge.onGymClick(gym.id);
                        }
                    });
                    
                    marker.addTo(map);
                    markers[gym.id] = marker;
                    bounds.push([gym.latitude, gym.longitude]);
                });
                
                // Fit map to show all gyms
                if (bounds.length > 0) {
                    map.fitBounds(bounds, {
                        padding: [50, 50],
                        maxZoom: 13
                    });
                }
                
                console.log('Added ' + gyms.length + ' gym markers');
            } catch(err) {
                console.error('updateGyms error:', err);
            }
        };
        
        // Function to highlight selected gym
        window.selectGym = function(gymId) {
            try {
                // Remove selected class from all markers
                document.querySelectorAll('.gym-marker').forEach(el => {
                    el.classList.remove('selected');
                });
                
                // Add selected class to the target marker
                const targetElement = document.querySelector('[data-gym-id="' + gymId + '"]');
                if (targetElement) {
                    targetElement.classList.add('selected');
                }
                
                // Fly to the gym location
                const gym = currentGyms.find(g => g.id === gymId);
                if (gym && map) {
                    map.flyTo([gym.latitude, gym.longitude], 15, {
                        duration: 1.0
                    });
                    
                    // Open popup
                    if (markers[gymId]) {
                        markers[gymId].openPopup();
                    }
                }
                
                selectedGymId = gymId;
            } catch(err) {
                console.error('selectGym error:', err);
            }
        };
        
        // Function to recenter map
        window.recenterMap = function() {
            try {
                if (map && currentGyms.length > 0) {
                    const bounds = currentGyms.map(gym => [gym.latitude, gym.longitude]);
                    map.fitBounds(bounds, {
                        padding: [50, 50],
                        maxZoom: 13,
                        duration: 1.0
                    });
                    
                    // Clear selection
                    document.querySelectorAll('.gym-marker').forEach(el => {
                        el.classList.remove('selected');
                    });
                    selectedGymId = null;
                }
            } catch(err) {
                console.error('recenterMap error:', err);
            }
        };
    </script>
</body>
</html>
